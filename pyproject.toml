[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "app-quechua"
version = "0.3.0"
description = "ASUS2 para interpretar quechua Collao en Windows"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=44,<48",
  "huggingface-hub>=0.28,<1",
  "numpy>=1.26,<3",
  "paramiko>=3.4,<6",
  "pydantic-settings>=2.8,<3",
  "PySide6-Essentials>=6.8,<7",
  "safetensors>=0.5,<1",
  "scipy>=1.11,<2",
  "sentencepiece>=0.2,<1",
  "sounddevice>=0.5,<1",
  "soundfile>=0.13,<1",
  "torch>=2.6,<3",
  "transformers>=4.48,<5",
  "webrtcvad-wheels>=2.0.14,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5"]

[tool.setuptools]
py-modules = ["asus"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
app = ["resources/*.svg"]
scripts = ["asus2_companions.json", "asus2-release.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
