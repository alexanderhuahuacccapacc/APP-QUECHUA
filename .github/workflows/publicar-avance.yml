name: Publicar avance de ASUS2

on:
  push:
    tags:
      - 'asus2-code-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta de avance que ya existe en GitHub
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: avance-${{ inputs.tag || github.ref_name }}

jobs:
  AHuaCcPublicar:
    if: startsWith(inputs.tag || github.ref_name, 'asus2-code-v')
    runs-on: ubuntu-latest
    env:
      AHuaCcReleaseTag: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Empaquetar el código y la configuración
        run: |
          git archive --format=zip --prefix=APP-QUECHUA/ --output=ASUS2-code.zip HEAD -- \
            LICENSE README.md asus.py requirements.txt model_index.json packaging/installer.iss \
            speech/config.json speech/preprocessor_config.json speech/special_tokens_map.json \
            speech/tokenizer_config.json speech/vocab.json \
            translation/added_tokens.json translation/config.json translation/generation_config.json \
            translation/sentencepiece.bpe.model translation/special_tokens_map.json \
            translation/tokenizer.json translation/tokenizer_config.json
          sha256sum ASUS2-code.zip > SHA256SUMS.txt

      - name: Publicar la versión preliminar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if AHuaCcDraft=$(gh release view "$AHuaCcReleaseTag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$AHuaCcDraft" = false ]; then
              exit 0
            fi
          else
            gh release create "$AHuaCcReleaseTag" --verify-tag --draft --prerelease \
              --title "ASUS2 · $AHuaCcReleaseTag" \
              --notes "Paquete de código y configuración para pruebas no comerciales. Los pesos ajustados se distribuyen por separado cuando se confirmen los permisos. Consulta el README y la licencia incluidos."
          fi
          gh release upload "$AHuaCcReleaseTag" ASUS2-code.zip SHA256SUMS.txt --clobber
          gh release edit "$AHuaCcReleaseTag" --draft=false
